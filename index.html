<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Mugs Store</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Robot:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Mugs Store</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact Us</a>
      <a href="cart.html">Cart (<span id="cart-count" style="display: none;">0</span>)</a>
    </nav>
  </header>

  <main>
    <h2>Welcome to our store!</h2>
    <p>Discover our curated collection of the best mugs.</p>
    
    <h3>Featured Products</h3>
    <div id="featured-products" class="products-grid">
      <!-- Products will be loaded here by JavaScript -->
    </div>
  </main>

  <script src="assets/js/main.js"></script> <!-- shared file first -->
  <script>
    // Home page only script
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('featured-products');

      fetch('data/products.json')
        .then(res => res.json())
        .then(products => {
          // Display first two products as featured
          const featured = products.slice(0, 2); 
          
          featured.forEach(product => {
            container.innerHTML += `
              <div class="product-card">
                <a href="product.html?id=${product.id}">
                  <img src="${product.image}" alt="${product.title}">
                  <h3>${product.title}</h3>
                  <p class="price">${product.price.toFixed(2)} SAR</p>
                </a>
                <button onclick="addToCart(${product.id})">Add to Cart</button>
              </div>
            `;
          });
        });
    });
  </script>
</body>
</html>
