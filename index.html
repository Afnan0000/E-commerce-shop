<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Mugs Store</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Robot:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Mugs Store</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact us</a>
      <a href="cart.html">Cart (<span id="cart-count" style="display: none;">0</span> )</a>
    </nav>
  </header>

  <main>
    <h2>أهلاً بك في متجرنا!</h2>
    <p>اكتشف مجموعتنا المختارة من أفضل الأكواب.</p>
    
    <h3>منتجات مميزة</h3>
    <div id="featured-products" class="products-grid">
      <!-- سيتم ملء المنتجات هنا بواسطة الجافاسكريبت -->
    </div>
  </main>

  <script src="assets/js/main.js"></script> <!-- الملف المشترك أولاً -->
  <script>
    // كود خاص بالصفحة الرئيسية فقط
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('featured-products');

      fetch('data/products.json')
        .then(res => res.json())
        .then(products => {
          // عرض أول منتجين فقط كمنتجات مميزة
          const featured = products.slice(0, 2); 
          
          featured.forEach(product => {
            container.innerHTML += `
              <div class="product-card">
                <a href="product.html?id=${product.id}">
                  <img src="${product.image}" alt="${product.title}">
                  <h3>${product.title}</h3>
                  <p class="price">${product.price.toFixed(2)} ر.س</p>
                </a>
                <button onclick="addToCart(${product.id})">أضف للسلة</button>
              </div>
            `;
          });
        });
    });
  </script>
</body>
</html>
