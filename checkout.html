<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <title>Checkout - Mugcraft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <header>
        <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>
        <a href="index.html" class="logo">Mugcraft</a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact Us</a>

            <span id="auth-links">
                <!-- Auth links injected by auth.js -->
            </span>


            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <svg class="sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
                <svg class="moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                    </path>
                </svg>
            </button>
        </nav>
    </header>

    <main>
        <div class="container">
            <h1 class="page-title">Checkout</h1>

            <div class="checkout-layout">
                <!-- LEFT: Forms -->
                <div class="checkout-form-col">

                    <!-- Shipping Section -->
                    <section class="checkout-section">
                        <h2>Shipping Information</h2>
                        <form id="checkout-form">
                            <div class="form-row">
                                <div class="form-group half">
                                    <label for="fname">First Name</label>
                                    <input type="text" id="fname" required placeholder="John">
                                </div>
                                <div class="form-group half">
                                    <label for="lname">Last Name</label>
                                    <input type="text" id="lname" required placeholder="Doe">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" required placeholder="john@example.com">
                            </div>

                            <div class="form-group">
                                <label for="address">Street Address</label>
                                <input type="text" id="address" required placeholder="123 Main St">
                            </div>

                            <div class="form-row">
                                <div class="form-group half">
                                    <label for="city">City</label>
                                    <input type="text" id="city" required placeholder="City">
                                </div>
                                <div class="form-group half">
                                    <label for="postcode">Postal Code</label>
                                    <input type="text" id="postcode" required placeholder="12345">
                                </div>
                            </div>
                        </form>
                    </section>

                    <!-- Payment Section Mockup -->
                    <section class="checkout-section">
                        <h2>Payment Details</h2>
                        <div class="payment-mockup">
                            <div class="form-group">
                                <label for="card-num">Card Number</label>
                                <input type="text" id="card-num" placeholder="0000 0000 0000 0000" maxlength="19">
                            </div>
                            <div class="form-row">
                                <div class="form-group half">
                                    <label for="expiry">Expiry</label>
                                    <input type="text" id="expiry" placeholder="MM/YY" maxlength="5">
                                </div>
                                <div class="form-group half">
                                    <label for="cvv">CVV</label>
                                    <input type="text" id="cvv" placeholder="123" maxlength="3">
                                </div>
                            </div>
                        </div>
                    </section>

                </div>

                <!-- RIGHT: Order Summary -->
                <div class="checkout-summary-col">
                    <div class="order-summary-card">
                        <h2>Order Summary</h2>
                        <div id="checkout-items" class="summary-items">
                            <!-- JS injected items -->
                        </div>

                        <div class="summary-totals">
                            <div class="row">
                                <span>Subtotal</span>
                                <span id="summary-subtotal">SAR 0.00</span>
                            </div>
                            <div class="row">
                                <span>Shipping</span>
                                <span>Free</span>
                            </div>
                            <hr>
                            <div class="row total">
                                <span>Total</span>
                                <span id="summary-total">SAR 0.00</span>
                            </div>
                        </div>

                        <button id="place-order-btn" class="btn-primary full-width">Place Order</button>
                        <p class="secure-note">
                            <svg fill="currentColor" viewBox="0 0 24 24" width="14" height="14">
                                <path
                                    d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                            </svg>
                            Secure Checkout
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Global Toast -->
    <div id="global-toast" class="toast"></div>

    <!-- Scripts -->
    <script src="assets/js/products-data.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/checkout.js"></script> <!-- New file -->

</body>

</html>
