<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <title>Login - Mugcraft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <header>
        <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>
        <a href="index.html" class="logo">Mugcraft</a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact Us</a>

            <span id="auth-links">
                <!-- Auth links injected by auth.js -->
            </span>

            <a href="cart.html" class="cart-link" aria-label="View cart"
                style="display:inline-flex;align-items:center;margin-left:12px;position:relative;text-decoration:none;">
                <svg class="cart-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false"
                    style="width:24px;height:24px;">
                    <title>Cart</title>
                    <circle cx="9" cy="21" r="1.5" fill="currentColor" />
                    <circle cx="18" cy="21" r="1.5" fill="currentColor" />
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                </svg>
                <span id="cart-count" class="cart-badge" aria-hidden="true"
                    style="position:absolute;top:-8px;right:-8px;background:#e74c3c;color:#fff;font-size:11px;padding:2px 6px;border-radius:10px;display:none;">0</span>
            </a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <svg class="sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
                <svg class="moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                    </path>
                </svg>
            </button>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <h1>Welcome Back</h1>
            <p>Login to your Mugcraft account.</p>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="auth-btn">Log In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = loginUser(email, password);

            if (result.success) {
                showToast('Welcome back, ' + result.user.name + '!');
                setTimeout(() => window.location.href = 'index.html', 1500);
            } else {
                showToast(result.message);
            }
        });
    </script>
</body>

</html>
