<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>سلة المشتريات</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <a href="index.html" class="logo">متجر الأكواب</a>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="shop.html">المتجر</a>
      <a href="contact.html">تواصل معنا</a>
      <a href="cart.html">السلة (<span id="cart-count" style="display: none;">0</span> )</a>
    </nav>
  </header>

  <main>
    <h1>سلة مشترياتك</h1>
    <div id="cart-items-container">
      <!-- سيتم عرض المنتجات المضافة للسلة هنا -->
    </div>
    <div id="cart-total" class="cart-total"></div>
    <div style="text-align: right; margin-top: 20px;">
        <a href="checkout.html" style="background-color: #28a745; color: white; padding: 15px 25px; text-decoration: none; border-radius: 5px;">الانتقال للدفع</a>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('cart-items-container');
      const totalEl = document.getElementById('cart-total');
      const cart = getCart(); // من main.js

      if (cart.length === 0) {
        container.innerHTML = '<p>سلتك فارغة. <a href="shop.html">ابدأ التسوق الآن!</a></p>';
        return;
      }

      // نحتاج لجلب معلومات المنتجات الكاملة (السعر، الصورة، الاسم)
      fetch('data/products.json')
        .then(res => res.json())
        .then(products => {
          let totalCost = 0;
          container.innerHTML = '';

          cart.forEach(cartItem => {
            const product = products.find(p => p.id === cartItem.id);
            if (product) {
              container.innerHTML += `
                <div class="cart-item">
                  <img src="${product.image}" alt="${product.title}">
                  <div>
                    <h3>${product.title}</h3>
                    <p>الكمية: ${cartItem.quantity}</p>
                    <p>السعر: ${(product.price * cartItem.quantity).toFixed(2)} ر.س</p>
                  </div>
                </div>
              `;
              totalCost += product.price * cartItem.quantity;
            }
          });

          totalEl.textContent = `الإجمالي: ${totalCost.toFixed(2)} ر.س`;
        });
    });
  </script>
</body>
</html>
