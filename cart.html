<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <a href="index.html" class="logo">Mugs Store</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact Us</a>
      <!-- Cart icon link -->
      <a href="cart.html" class="cart-link" aria-label="View cart"
        style="display:inline-flex;align-items:center;margin-left:12px;position:relative;text-decoration:none;">
        <svg class="cart-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false"
          style="width:24px;height:24px;">
          <title>Cart</title>
          <circle cx="9" cy="21" r="1.5" fill="currentColor" />
          <circle cx="18" cy="21" r="1.5" fill="currentColor" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
        <span id="cart-count" class="cart-badge" aria-hidden="true"
          style="position:absolute;top:-8px;right:-8px;background:#e74c3c;color:#fff;font-size:11px;padding:2px 6px;border-radius:10px;display:none;">0</span>
      </a>
    </nav>
  </header>

  <main>
    <h1>Your Shopping Cart</h1>
    <div id="cart-items-container">
      <!-- Cart items will be displayed here -->
    </div>
    <div id="cart-total" class="cart-total"></div>
    <div style="text-align: center; margin-top: 20px;">
      <a href="checkout.html"
        style="background-color: #28a745; color: white; padding: 15px 25px; text-decoration: none; border-radius: 5px;">Proceed
        to Checkout</a>
    </div>
  </main>

  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('cart-items-container');
      const totalEl = document.getElementById('cart-total');
      const cart = getCart(); // from main.js

      if (cart.length === 0) {
        container.innerHTML = '<p>Your cart is empty. <a href="shop.html">Start shopping now!</a></p>';
        return;
      }

      // Use embedded product data (from products-data.js)
      const products = typeof getProducts === 'function' ? getProducts() : [];
      let totalCost = 0;
      container.innerHTML = '';

      cart.forEach(cartItem => {
        const product = products.find(p => p.id === cartItem.id);
        if (product) {
          container.innerHTML += `
            <div class="cart-item">
              <img src="${product.image}" alt="${product.title}" onerror="this.src='images/placeholder.jpg'; this.onerror=null;">
              <div>
                <h3>${product.title}</h3>
                <p>Quantity: ${cartItem.quantity}</p>
                <p>Price: ${(product.price * cartItem.quantity).toFixed(2)} SAR</p>
              </div>
            </div>
          `;
          totalCost += product.price * cartItem.quantity;
        }
      });

      totalEl.textContent = `Total: ${totalCost.toFixed(2)} SAR`;
    });
  </script>
</body>

</html>
